<style>
.lightbox:focus { outline: none; }

/* ---------- Staggered layout ---------- */
.grid.stagger {
  display: block;
  max-width: 1500px;
  margin: 0 auto;
  padding: 48px 3vw 100px;
}

.srow {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  column-gap: 2vw;
  align-items: start;
  margin-bottom: clamp(24px, 3vw, 48px);
}
.srow:last-child { margin-bottom: 0; }

.stagger .thumb {
  display: flex;
  aspect-ratio: auto;
  overflow: visible;
  background: none;
}

.stagger .thumb img {
  position: static;
  inset: auto;
  display: block;
  width: 100%;
  height: auto;
  padding: 0;
  aspect-ratio: var(--r, 3 / 2);
  /* caps the height so no thumbnail gets too large (portraits especially) */
  max-width: min(100%, calc(46vh * var(--r, 1.5)));
  object-fit: cover;
  background: #f2f2f2;
}

.stagger .thumb,
.stagger .thumb *,
.stagger .thumb:focus,
.stagger .thumb:focus-visible,
.stagger .thumb:focus img,
.stagger .thumb:focus-visible img {
  outline: none !important;
  box-shadow: none !important;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- Year navigation dots ---------- */
@media (min-width: 601px) {
  .grid.stagger { padding-right: calc(3vw + 40px); }
}

.ynav {
  position: fixed;
  top: 50%;
  right: 12px;
  transform: translateY(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
}

.ynav button {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  width: 32px;
  height: 20px;
  padding: 0 10px 0 0;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.ynav button:focus:not(:focus-visible) { outline: none; }

.ynav button::after {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #cfcfcf;
  transition: background .2s ease, transform .3s var(--ease);
}
.ynav button:hover::after { background: #000; }
.ynav button.on::after { background: #000; transform: scale(1.4); }

.ynav span {
  position: absolute;
  right: 28px;
  padding: 2px 6px;
  font: 400 11px/1.4 var(--font-nav);
  letter-spacing: .1em;
  color: #000;
  background: rgba(255, 255, 255, .9);
  white-space: nowrap;
  opacity: 0;
  transform: translateX(4px);
  transition: opacity .2s ease, transform .3s var(--ease);
  pointer-events: none;
}
.ynav:hover span { opacity: .4; transform: none; }
.ynav button:hover span { opacity: 1; }

@media (max-width: 600px) {
  .ynav { display: none; }
}

@media (max-width: 992px) {
  .grid.stagger { padding-top: 24px; }
}

@media (max-width: 600px) {
  .grid.stagger { padding: 16px 16px 80px; }
  .srow { grid-template-columns: 1fr; row-gap: 20px; margin-bottom: 20px; }
  .srow .thumb {
    grid-column: 1 !important;
    align-self: auto !important;
    justify-content: center !important;
  }
}
</style>

].map(([id, caption]) => ({
  id, caption,
  thumb: `files/images_small/${id}t.jpg`,
  full: `files/images_full/${id}.jpg`,
  text: caption.replace(/<[^>]+>/g, '')
}));

const $ = id => document.getElementById(id);
const grid = $('grid'), lb = $('lightbox'), lbImg = $('lbImg'), caption = $('caption');

/* ---------- Staggered grid ----------
   12-column rows. c = grid columns, a = vertical alignment within the row,
   j = which side the image hugs if it's narrower than its cell (portraits).
   Widths are 3 or 4 columns, so sizes vary by at most 1.33×.
   Mostly three images per row, with an occasional pair for rhythm. */
const ROWS = [
  [{ c: '1 / 5',  j: 'end' },              { c: '6 / 9',  a: 'end',    j: 'center' }, { c: '10 / 13', a: 'center', j: 'start' }],
  [{ c: '2 / 5',  a: 'center', j: 'end' }, { c: '6 / 10', j: 'center' },              { c: '10 / 13', a: 'end',    j: 'start' }],
  [{ c: '3 / 7',  j: 'end' },              { c: '8 / 12', a: 'end',    j: 'start' }],
  [{ c: '1 / 4',  a: 'end', j: 'end' },    { c: '5 / 9',  j: 'center' },              { c: '10 / 13', a: 'center', j: 'start' }],
  [{ c: '1 / 5',  a: 'center', j: 'end' }, { c: '6 / 9',  j: 'center' },              { c: '9 / 13',  a: 'end',    j: 'start' }],
  [{ c: '4 / 8',  j: 'center' },           { c: '9 / 12', a: 'center', j: 'start' }],
];
const JUSTIFY = { start: 'flex-start', end: 'flex-end', center: 'center' };

const thumbHTML = (d, i, p) => `
  <a class="thumb" href="${d.full}" data-i="${i}" aria-label="${d.text.replace(/"/g, '&quot;')}"
     style="grid-column:${p.c};align-self:${p.a || 'start'};justify-content:${JUSTIFY[p.j]}">
    <img src="${d.thumb}" alt="" loading="lazy" decoding="async">
  </a>`;

let html = '', k = 0, r = 0;
while (k < DATA.length) {
  const pattern = ROWS[r++ % ROWS.length];
  let row = '';
  for (const p of pattern) {
    if (k >= DATA.length) break;
    row += thumbHTML(DATA[k], k, p);
    k++;
  }
  html += `<div class="srow">${row}</div>`;
}
grid.innerHTML = html;
const thumbs = grid.querySelectorAll('.thumb');

/* ---------- Year navigation dots ----------
   One dot per year (first photo of that year). Jumps are instant, not smooth,
   so lazy loading only fetches the images around the target, not everything in between. */
const YEARS = [], seen = new Set();
DATA.forEach((d, i) => {
  const y = (d.text.match(/(\d{4})\s*$/) || [])[1];
  if (y && !seen.has(y)) { seen.add(y); YEARS.push({ y, i }); }
});

const ynav = document.createElement('nav');
ynav.className = 'ynav';
ynav.setAttribute('aria-label', 'Jump to year');
ynav.innerHTML = YEARS.map(({ y, i }) =>
  `<button type="button" data-i="${i}" aria-label="${y}"><span>${y}</span></button>`).join('');
document.body.appendChild(ynav);
const dots = ynav.querySelectorAll('button');

const rowOf = i => thumbs[i].parentElement;
const headOffset = () => innerWidth <= 992 ? 96 : 32;

ynav.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const top = rowOf(+b.dataset.i).getBoundingClientRect().top + scrollY - headOffset();
  scrollTo({ top, behavior: 'instant' });
});

let navTick = false;
function markYear() {
  navTick = false;
  const line = innerHeight * 0.4;
  let k = 0;
  YEARS.forEach(({ i }, n) => { if (rowOf(i).getBoundingClientRect().top <= line) k = n; });
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) k = YEARS.length - 1;
  dots.forEach((d, n) => {
    d.classList.toggle('on', n === k);
    n === k ? d.setAttribute('aria-current', 'true') : d.removeAttribute('aria-current');
  });
}
addEventListener('scroll', () => { if (!navTick) { navTick = true; requestAnimationFrame(markYear); } }, { passive: true });
addEventListener('resize', markYear);
markYear();

grid.querySelectorAll('img').forEach(img => {
  const done = () => {
    if (img.naturalWidth) img.style.setProperty('--r', img.naturalWidth / img.naturalHeight);
    img.classList.add('loaded');
  };
  img.complete ? done() : img.addEventListener('load', done, { once: true });
});

grid.addEventListener('click', e => {
  const a = e.target.closest('.thumb');
  if (!a) return;
  e.preventDefault();
  openAt(+a.dataset.i, a);
});

/* ---------- Lightbox ---------- */
const EASE = 'cubic-bezier(.2, .7, .2, 1)';
const FRAME = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let current = 0, opener = null, token = 0, nat = { w: 3, h: 2 }, maxed = false, known = false;

const isOpen = () => lb.classList.contains('open');
const px = r => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
const thumbRect = a => {
  const r = a.querySelector('img').getBoundingClientRect();
  return { left: r.left + FRAME, top: r.top + FRAME, width: r.width - FRAME * 2, height: r.height - FRAME * 2 };
};

function fit() {
  const small = innerWidth <= 600;
  const side = maxed ? 0 : small ? 8 : 64, top = maxed ? 0 : small ? 44 : 56;
  const aw = innerWidth - side * 2, ah = maxed ? innerHeight : innerHeight - caption.offsetHeight - top - 8;
  const s = Math.min(aw / nat.w, ah / nat.h, known ? 1 : Infinity), w = nat.w * s, h = nat.h * s;
  return { left: side + (aw - w) / 2, top: top + (ah - h) / 2, width: w, height: h };
}

const place = () => Object.assign(lbImg.style, px(fit()));
const setCaption = d => { caption.innerHTML = `${d.caption} &copy; André Baumgart`; };
const preload = i => { if (i >= 0 && i < DATA.length) new Image().src = DATA[i].full; };

function updateNav() {
  const first = current === 0, last = current === DATA.length - 1;
  $('lbPrev').classList.toggle('off', first);
  $('lbNext').classList.toggle('off', last);
  $('lbPrev').setAttribute('aria-disabled', first);
  $('lbNext').setAttribute('aria-disabled', last);
}

function zoom(from, to, duration = 380) {
  lbImg.getAnimations().forEach(a => a.cancel());
  if (reduce.matches) return null;
  const anim = lbImg.animate([px(from), px(to)], { duration, easing: EASE, fill: 'forwards' });
  anim.onfinish = () => { if (isOpen()) anim.cancel(); };
  return anim;
}

function toggleMax() {
  const from = lbImg.getBoundingClientRect();
  maxed = !maxed;
  lb.classList.toggle('max', maxed);
  place();
  zoom(from, fit(), 300);
}

function openAt(i, a) {
  opener = a;
  current = i;
  maxed = false;
  known = false;
  lb.classList.remove('max');
  updateNav();
  const d = DATA[i], t = a.querySelector('img'), my = ++token;

  lbImg.getAnimations().forEach(x => x.cancel());
  nat = { w: t.naturalWidth || 3, h: t.naturalHeight || 2 };
  lbImg.src = t.currentSrc || t.src;
  setCaption(d);
  lb.classList.add('open');
  place();
  zoom(thumbRect(a), fit());

  const full = new Image();
  full.src = d.full;
  (full.decode ? full.decode() : Promise.resolve()).catch(() => {}).then(() => {
    if (my !== token) return;
    const now = lbImg.getBoundingClientRect();
    nat = { w: full.naturalWidth || nat.w, h: full.naturalHeight || nat.h };
    known = true;
    lbImg.src = d.full;
    place();
    const to = fit();
    if (Math.abs(to.width - now.width) > 2 || Math.abs(to.height - now.height) > 2) zoom(now, to, 300);
    preload(current + 1);
    preload(current - 1);
  });
  lb.focus({ preventScroll: true });
}

function show(i) {
  if (i < 0 || i >= DATA.length) return;
  current = i;
  updateNav();
  const d = DATA[current], my = ++token, img = new Image();
  img.src = d.full;
  (img.decode ? img.decode() : Promise.resolve()).catch(() => {}).then(() => {
    if (my !== token) return;
    nat = { w: img.naturalWidth || nat.w, h: img.naturalHeight || nat.h };
    known = true;
    lbImg.getAnimations().forEach(x => x.cancel());
    lbImg.src = d.full;
    setCaption(d);
    place();
    preload(current + 1);
    preload(current - 1);
  });
}

const go = dir => show(current + dir);

function closeLb() {
  if (!isOpen()) return;
  token++;
  const a = thumbs[current];
  const from = lbImg.getBoundingClientRect();
  maxed = false;
  lb.classList.remove('open', 'max');
  if (a) {
    let r = a.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) a.scrollIntoView({ block: 'center' });
    zoom(from, thumbRect(a));
  }
  (a || opener) && (a || opener).focus({ preventScroll: true, focusVisible: false });
}

lb.addEventListener('click', e => {
  if (e.target.closest('.lb-close')) return closeLb();
  if (e.target.closest('.lb-prev')) return go(-1);
  if (e.target.closest('.lb-next')) return go(1);
  if (e.target === lbImg) return toggleMax();
  closeLb();
});

lb.querySelectorAll('.lb-btn').forEach(btn =>
  btn.addEventListener('mousedown', e => e.preventDefault())
);

document.addEventListener('keydown', e => {
  if (!isOpen()) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  if ([' ', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'].includes(e.key)) e.preventDefault();
});

addEventListener('resize', () => { if (isOpen()) { lbImg.getAnimations().forEach(a => a.cancel()); place(); } });

lb.addEventListener('wheel', e => { if (!e.ctrlKey) e.preventDefault(); }, { passive: false });

const zoomed = () => window.visualViewport && visualViewport.scale > 1.01;
if (window.visualViewport) visualViewport.addEventListener('resize', () => { lb.style.touchAction = zoomed() ? 'auto' : ''; });

let sx = 0, sy = 0, multi = false;
lb.addEventListener('touchstart', e => {
  if (e.touches.length > 1) multi = true;
  else { multi = false; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
}, { passive: true });
lb.addEventListener('touchend', e => {
  if (multi) { if (!e.touches.length) multi = false; return; }
  if (zoomed()) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeLb();
}, { passive: true });
</script>
