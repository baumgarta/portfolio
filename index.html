<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>André Baumgart</title>
<link rel="icon" href="files/fav.png" type="image/x-icon">
<link rel="stylesheet" href="style.css">
</head>
<body class="intro">

<input type="checkbox" id="menu" class="menu-toggle" aria-label="Toggle menu">
<nav class="sidebar" aria-label="Main">
  <a class="brand" href="photography.html">André Baumgart</a>
  <a class="nav-link" href="photography.html">Gallery</a>
  <a class="nav-link" href="contact.html">Contact</a>
  <div class="progress" aria-hidden="true"><span></span></div>
  <button class="play" type="button" aria-label="Pause slideshow"></button>
</nav>
<header class="topbar">
  <a class="brand" href="index.html">André Baumgart</a>
  <button class="play" type="button" aria-label="Pause slideshow"></button>
  <label class="menu-btn" for="menu" aria-label="Menu">☰</label>
  <div class="progress" aria-hidden="true"><span></span></div>
</header>
<label class="overlay" for="menu"></label>

<main class="slideshow" id="show" aria-roledescription="carousel" aria-label="Selected photographs">
  <button class="zone prev" id="prev" aria-label="Previous image" tabindex="-1"></button>
  <button class="zone next" id="next" aria-label="Next image" tabindex="-1"></button>
</main>

<script>
const IDS = ['0027','0103','0115','0119','0064','0036','0010','0102','0032','0052','0123','0126','0044','0001','0017','0022','0049','0113','0109','0009','0018','0039','0031','0011','0006','0094','0055','0013','0148','0023'];
const INTERVAL = 6500;

const show = document.getElementById('show');
const bars = document.querySelectorAll('.progress');
const playBtns = document.querySelectorAll('.play');

const slides = IDS.map(id => {
  const img = document.createElement('img');
  img.className = 'slide';
  img.alt = '';
  img.decoding = 'async';
  img.dataset.src = `files/images_full/img${id}.jpg`;
  show.insertBefore(img, document.getElementById('prev'));
  return img;
});

const ensure = i => {
  const s = slides[(i + slides.length) % slides.length];
  if (!s.src) s.src = s.dataset.src;
  return s;
};

let cur = 0, timer, busy = false, started = false;

function go(dir) {
  if (busy) return false;
  const idx = (cur + dir + slides.length) % slides.length;
  const next = ensure(idx), out = slides[cur];
  if (next === out) return false;
  busy = true;
  restart();

  const reveal = () => {
    next.style.transition = 'none';
    next.style.transform = `translateX(${dir * 100}%)`;
    next.offsetWidth; 
    next.style.transition = '';
    next.style.transform = '';
    next.classList.add('active', 'in');
    out.classList.remove('active');
    out.classList.add('out');
    out.style.transform = `translateX(${-dir * 30}%)`;
    cur = idx;
    ensure(cur + 1);
    setTimeout(() => {
      out.style.transition = 'none';
      out.style.transform = '';
      out.classList.remove('out');
      out.offsetWidth;
      out.style.transition = '';
      next.classList.remove('in');
      busy = false;
    }, 350);
  };
  next.complete && next.naturalWidth ? reveal() : next.addEventListener('load', reveal, { once: true });
  return true;
}

let t0 = 0, raf = 0, elapsed = 0, paused = false, running = false;

const draw = p => bars.forEach(b => { b.firstElementChild.style.transform = `scaleX(${p})`; });

function paint() {
  const p = Math.min((performance.now() - t0) / INTERVAL, 1);
  draw(p);
  if (p < 1) raf = requestAnimationFrame(paint);
}

function stop() {
  if (running) elapsed = Math.min(performance.now() - t0, INTERVAL);
  running = false;
  clearTimeout(timer);
  cancelAnimationFrame(raf);
  draw(elapsed / INTERVAL);
}

function run() {
  stop();
  if (paused || document.hidden || !started) return;
  running = true;
  t0 = performance.now() - elapsed;
  timer = setTimeout(() => { if (!go(1)) restart(); }, INTERVAL - elapsed);
  paint();
}

function restart() {
  running = false;
  elapsed = 0;
  run();
}

function setPaused(p) {
  paused = p;
  playBtns.forEach(b => {
    b.classList.toggle('paused', p);
    b.setAttribute('aria-label', p ? 'Play slideshow' : 'Pause slideshow');
  });
  run();
}

playBtns.forEach(b => b.addEventListener('click', () => setPaused(!paused)));

slides[0].fetchPriority = 'high';
slides[0].src = slides[0].dataset.src;
slides[0].style.transition = 'none';
slides[0].classList.add('active');
slides[0].offsetWidth;
slides[0].style.transition = '';
slides[0].classList.add('pre');

function startShow() {
  if (started) return;
  started = true;
  const first = slides[0];
  const fade = () => {
    first.classList.remove('pre');
    first.classList.add('fade');
    first.addEventListener('animationend', () => first.classList.remove('fade'), { once: true });
    ensure(1);
    restart();
  };
  (first.decode ? first.decode() : Promise.resolve()).catch(() => {}).then(fade);
}

slides[0].addEventListener('load', startShow, { once: true });
if (slides[0].complete) startShow();

document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
  if (e.key === ' ' && !e.target.closest('button, a, input')) { e.preventDefault(); setPaused(!paused); }
});
document.addEventListener('visibilitychange', run);

const zoomed = () => window.visualViewport && visualViewport.scale > 1.01;
let sx = 0, multi = false;
show.addEventListener('touchstart', e => {
  if (e.touches.length > 1) multi = true;
  else { multi = false; sx = e.touches[0].clientX; }
}, { passive: true });
show.addEventListener('touchend', e => {
  if (multi) { if (!e.touches.length) multi = false; return; }
  if (zoomed()) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
}, { passive: true });
</script>
</body>
</html>
